name: Build and deploy

# Rebuilds harisrinivasan.dev every day so the merged-PR list stays fresh, on every push to main,
# and on demand. Deploys to Cloudflare (static assets on Workers, free plan).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refresh GitHub data
        # If GitHub rate-limits us, keep the committed data and deploy anyway.
        continue-on-error: true
        run: npm run data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Tell search engines (IndexNow)
        # Bing, Yandex, Seznam and others share IndexNow; the key file is served at /4c5d498acd8a57307d10a92c02a6ddb8.txt.
        continue-on-error: true
        run: |
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"host":"harisrinivasan.dev","key":"4c5d498acd8a57307d10a92c02a6ddb8","keyLocation":"https://harisrinivasan.dev/4c5d498acd8a57307d10a92c02a6ddb8.txt","urlList":["https://harisrinivasan.dev/","https://harisrinivasan.dev/llms.txt","https://harisrinivasan.dev/llms-full.txt"]}' \
            -w "IndexNow: %{http_code}\n"
