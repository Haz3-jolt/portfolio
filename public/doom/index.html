<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOOM</title>
<!-- id Software's original linuxdoom-1.10 source (GPL-2.0) with the shareware DOOM1.WAD, compiled to
     WebAssembly by https://github.com/diekmann/wasm-fizzbuzz (doom/). Single player only. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; outline: none; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; color: #ece5d3; font: 13px ui-monospace, Menlo, monospace; pointer-events: none; }
  /* Touch controls: shown only on touch screens. Left: a d-pad. Right: fire, use, run. */
  #pad { display: none; position: absolute; inset: 0; pointer-events: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  @media (pointer: coarse) { #pad { display: block; } }
  #pad button { pointer-events: auto; position: absolute; border: 0; border-radius: 14px; background: rgb(255 255 255 / 0.12); color: #ece5d3; font: 600 12px ui-monospace, Menlo, monospace; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #pad button[data-down] { background: rgb(255 106 61 / 0.55); }
  #pad .dir { width: 54px; height: 54px; }
  #pad [data-k="up"] { left: 70px; bottom: 128px; } #pad [data-k="down"] { left: 70px; bottom: 16px; }
  #pad [data-k="left"] { left: 12px; bottom: 72px; } #pad [data-k="right"] { left: 128px; bottom: 72px; }
  #pad .act { width: 72px; height: 72px; border-radius: 50%; }
  #pad [data-k="fire"] { right: 16px; bottom: 60px; background: rgb(255 106 61 / 0.35); }
  #pad [data-k="use"] { right: 100px; bottom: 24px; width: 58px; height: 58px; }
  #pad [data-k="run"] { right: 100px; bottom: 100px; width: 58px; height: 58px; }
  #pad .sys { top: 10px; width: 64px; height: 32px; border-radius: 10px; font-size: 11px; }
  #pad [data-k="esc"] { left: 10px; } #pad [data-k="enter"] { right: 10px; }
</style>
</head>
<body>
<canvas id="screen" width="640" height="400" tabindex="0"></canvas>
<div id="status">loading DOOM…</div>
<div id="pad" aria-hidden="true">
  <button class="dir" data-k="up">▲</button><button class="dir" data-k="down">▼</button>
  <button class="dir" data-k="left">◀</button><button class="dir" data-k="right">▶</button>
  <button class="act" data-k="fire">FIRE</button><button class="act" data-k="use">USE</button><button class="act" data-k="run">RUN</button>
  <button class="sys" data-k="esc">MENU</button><button class="sys" data-k="enter">ENTER</button>
</div>
<script>
"use strict";
const memory = new WebAssembly.Memory({ initial: 108 });
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const W = 640, H = 400;
const noop = () => {};
const importObject = {
  js: {
    js_console_log: noop, js_stdout: noop, js_stderr: noop,
    js_milliseconds_since_start: () => performance.now(),
    js_draw_screen: (ptr) => ctx.putImageData(new ImageData(new Uint8ClampedArray(memory.buffer, ptr, W * H * 4), W, H), 0, 0),
  },
  env: { memory },
};
// Browser key → Doom key code (by e.key; keyCode only as a fallback).
const NAMED = { ArrowLeft: 0xac, ArrowUp: 0xad, ArrowRight: 0xae, ArrowDown: 0xaf, Control: 0x9d, Shift: 0xb6, Alt: 0xb8, Enter: 13, Escape: 27, " ": 32, Backspace: 127, Tab: 9, "-": 0x2d, "=": 0x3d };
const doomKey = (e) => {
  if (e.key in NAMED) return NAMED[e.key];
  if (/^F([1-9]|1[0-2])$/.test(e.key)) return 0x80 + 0x3a + Number(e.key.slice(1)); // KEY_F1 = 0x80+0x3b
  if (e.key && e.key.length === 1) return e.key.toLowerCase().charCodeAt(0);
  const k = e.keyCode;
  return ({ 8: 127, 16: 0xb6, 17: 0x9d, 18: 0xb8, 37: 0xac, 38: 0xad, 39: 0xae, 40: 0xaf })[k] ?? (k >= 65 && k <= 90 ? k + 32 : k);
};
WebAssembly.instantiateStreaming(fetch("doom.wasm"), importObject).then(({ instance }) => {
  const ex = instance.exports;
  ex.main();
  document.getElementById("status").remove();
  const send = (type, code) => ex.add_browser_event(type, code);
  addEventListener("keydown", (e) => { if (!e.repeat) send(0, doomKey(e)); e.preventDefault(); });
  addEventListener("keyup", (e) => { send(1, doomKey(e)); e.preventDefault(); });
  addEventListener("pointerdown", () => canvas.focus());
  // Touch controls: each button holds its Doom key down while a finger is on it (multi-touch works).
  const PADKEYS = { up: 0xad, down: 0xaf, left: 0xac, right: 0xae, fire: 0x9d, use: 32, run: 0xb6, esc: 27, enter: 13 };
  document.querySelectorAll("#pad button").forEach((b) => {
    const code = PADKEYS[b.dataset.k];
    const press = (e) => { e.preventDefault(); if (b.hasAttribute("data-down")) return; b.setAttribute("data-down", ""); try { b.setPointerCapture(e.pointerId); } catch {} send(0, code); };
    const release = (e) => { e.preventDefault(); if (!b.hasAttribute("data-down")) return; b.removeAttribute("data-down"); send(1, code); };
    b.addEventListener("pointerdown", press);
    b.addEventListener("pointerup", release);
    b.addEventListener("pointercancel", release);
    b.addEventListener("lostpointercapture", release);
    b.addEventListener("contextmenu", (e) => e.preventDefault());
  });
  // Jump straight in: open the menu, pick New Game, the episode and the default skill.
  [0, 250, 500, 750].forEach((t, i) => setTimeout(() => { const k = i === 0 ? 27 : 13; send(0, k); setTimeout(() => send(1, k), 60); }, 400 + t));
  const step = () => { ex.doom_loop_step(); requestAnimationFrame(step); };
  requestAnimationFrame(step);
  canvas.focus();
});
</script>
</body>
</html>
