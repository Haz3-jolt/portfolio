<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOOM</title>
<!-- id Software's original linuxdoom-1.10 source (GPL-2.0) with the shareware DOOM1.WAD, compiled to
     WebAssembly by https://github.com/diekmann/wasm-fizzbuzz (doom/). Single player only. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; outline: none; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; color: #ece5d3; font: 13px ui-monospace, Menlo, monospace; pointer-events: none; }
</style>
</head>
<body>
<canvas id="screen" width="640" height="400" tabindex="0"></canvas>
<div id="status">loading DOOM…</div>
<script>
"use strict";
const memory = new WebAssembly.Memory({ initial: 108 });
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const W = 640, H = 400;
const noop = () => {};
const importObject = {
  js: {
    js_console_log: noop, js_stdout: noop, js_stderr: noop,
    js_milliseconds_since_start: () => performance.now(),
    js_draw_screen: (ptr) => ctx.putImageData(new ImageData(new Uint8ClampedArray(memory.buffer, ptr, W * H * 4), W, H), 0, 0),
  },
  env: { memory },
};
// Browser key → Doom key code (by e.key; keyCode only as a fallback).
const NAMED = { ArrowLeft: 0xac, ArrowUp: 0xad, ArrowRight: 0xae, ArrowDown: 0xaf, Control: 0x9d, Shift: 0xb6, Alt: 0xb8, Enter: 13, Escape: 27, " ": 32, Backspace: 127, Tab: 9, "-": 0x2d, "=": 0x3d };
const doomKey = (e) => {
  if (e.key in NAMED) return NAMED[e.key];
  if (/^F([1-9]|1[0-2])$/.test(e.key)) return 0x80 + 0x3a + Number(e.key.slice(1)); // KEY_F1 = 0x80+0x3b
  if (e.key && e.key.length === 1) return e.key.toLowerCase().charCodeAt(0);
  const k = e.keyCode;
  return ({ 8: 127, 16: 0xb6, 17: 0x9d, 18: 0xb8, 37: 0xac, 38: 0xad, 39: 0xae, 40: 0xaf })[k] ?? (k >= 65 && k <= 90 ? k + 32 : k);
};
WebAssembly.instantiateStreaming(fetch("doom.wasm"), importObject).then(({ instance }) => {
  const ex = instance.exports;
  ex.main();
  document.getElementById("status").remove();
  const send = (type, code) => ex.add_browser_event(type, code);
  addEventListener("keydown", (e) => { if (!e.repeat) send(0, doomKey(e)); e.preventDefault(); });
  addEventListener("keyup", (e) => { send(1, doomKey(e)); e.preventDefault(); });
  addEventListener("pointerdown", () => canvas.focus());
  // Jump straight in: open the menu, pick New Game, the episode and the default skill.
  [0, 250, 500, 750].forEach((t, i) => setTimeout(() => { const k = i === 0 ? 27 : 13; send(0, k); setTimeout(() => send(1, k), 60); }, 400 + t));
  const step = () => { ex.doom_loop_step(); requestAnimationFrame(step); };
  requestAnimationFrame(step);
  canvas.focus();
});
</script>
</body>
</html>
